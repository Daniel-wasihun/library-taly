<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="wduBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="wduGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="wduShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#wduBgGrad)" filter="url(#wduShadow)" stroke="url(#wduGoldGrad)" stroke-width="8"/>
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Star of Knowledge -->
  <g transform="translate(256, 140)">
    <circle cx="0" cy="0" r="16" fill="url(#wduGoldGrad)"/>
    <path d="M0 -30 L0 30 M-30 0 L30 0 M-21 -21 L21 21 M-21 21 L21 -21" stroke="#fcd34d" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>

  <!-- Open Academic Book -->
  <g transform="translate(256, 260)">
    <!-- Left Page -->
    <path d="M0 -55 C-60 -75 -120 -50 -130 -45 L-130 55 C-120 50 -60 25 0 45 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Left page text lines -->
    <line x1="-110" y1="-20" x2="-25" y2="-10" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-110" y1="2" x2="-25" y2="12" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-110" y1="24" x2="-45" y2="34" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Page -->
    <path d="M0 -55 C60 -75 120 -50 130 -45 L130 55 C120 50 60 25 0 45 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Right page text lines -->
    <line x1="25" y1="-10" x2="110" y2="-20" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="12" x2="110" y2="2" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="34" x2="90" y2="24" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

    <!-- Central Book Spine -->
    <line x1="0" y1="-56" x2="0" y2="47" stroke="url(#wduGoldGrad)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- WDU Banner -->
  <g transform="translate(256, 360)">
    <rect x="-85" y="0" width="170" height="34" rx="8" fill="url(#wduGoldGrad)" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#0f172a" letter-spacing="2">WDU</text>
  </g>

  <!-- Arch text: WOLDIA UNIVERSITY -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#93c5fd" letter-spacing="3">LIBRARY PORTAL</text>
</svg>
