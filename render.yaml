services:
  - type: web
    name: unilibrary-portal
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: UniLibrary Portal
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_TIMEZONE
        value: Africa/Addis_Ababa
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false # Set to https://<your-service>.onrender.com once created
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false # Supabase Host (e.g. aws-0-eu-central-1.pooler.supabase.com or db.<ref>.supabase.co)
      - key: DB_PORT
        value: 5432 # or 6543 if using Supabase Pooler
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false # Supabase User (e.g. postgres.your_project_ref or postgres)
      - key: DB_PASSWORD
        sync: false # Your Supabase DB Password
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: 120
      - key: SESSION_ENCRYPT
        value: false
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: RUN_MIGRATIONS
        value: true
      - key: RUN_SEEDERS
        value: true # Seeds default roles, branches, and admin user on first launch
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false # e.g. <your-service>.onrender.com
